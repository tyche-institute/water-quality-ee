name: Analytics worker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the worker after validation"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "analytics-worker/**"
      - "frontend/app/lib/analytics.ts"
      - "scripts/smoke_analytics_endpoint.py"
      - ".github/workflows/analytics-worker.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: analytics-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: analytics-worker
        run: npm install

      - name: Typecheck worker
        working-directory: analytics-worker
        run: npx tsc --noEmit

      - name: Python smoke script syntax check
        run: python3 -m py_compile scripts/smoke_analytics_endpoint.py

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: analytics-worker/package-lock.json

      - name: Install worker dependencies
        working-directory: analytics-worker
        run: npm install

      - name: Deploy analytics worker
        working-directory: analytics-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
